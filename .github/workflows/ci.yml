name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install swift-format
        run: brew install swift-format
      - name: Verify formatting
        run: swift-format lint --recursive --parallel --strict Sources Tests Package.swift App AppTests
      - name: Test core package
        run: swift test
