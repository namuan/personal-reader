name: PersonalReaderApp
options:
  bundleIdPrefix: com.github.namuan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PersonalReader:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  PersonalReaderApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/PrivacyInfo.xcprivacy"
      - path: App/Resources/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    dependencies:
      - package: PersonalReader
        products:
          - PersonalReaderCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Personal Reader
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - com.github.namuan.personalreader.backgroundRefresh
        UIBackgroundModes:
          - fetch
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.namuan.personalreader
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"

  PersonalReaderAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: PersonalReaderApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PersonalReaderApp:
    build:
      targets:
        PersonalReaderApp: all
        PersonalReaderAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PersonalReaderAppTests
    archive:
      config: Release
